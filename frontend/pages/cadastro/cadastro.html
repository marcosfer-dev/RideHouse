<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <link rel="stylesheet" href="../../css/import.css">
 
    <title>Cadastro</title>

    <link rel="icon" type="image/png" href="../../assets/img/icone-ridehouse.png">
</head>
 
<body>
    <main class="cadastro-container">
 
        <div class="img">
            <img src="../../assets/img/img-ridehouse-cafeteria.jpg" alt="Imagem de bicicleta e no fundo a cafeteria">
        </div>
 
        <div class="bg">
 
            <div class="cadastro-forms">
 
                <h1>Criar sua conta</h1>
                <p class="subtitulo">Preencha os dados abaixo para criar sua conta</p>
 
                <form>
 
                    <div class="formulario-modelo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nomeCompleto" placeholder="Digite seu nome completo" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="data_nascimento">Data de nascimento</label>
                        <input type="date" id="data_nascimento" name="dataNascimento" placeholder="dd/mm/aaaa" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-99999" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="genero">Gênero (opcional)</label>
                        <select id="genero" name="genero">
                            <option value="" selected>Selecione</option>
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                            <option value="NAO_BINARIO">Não binário</option>
                            <option value="PREFIRO_NAO_DIZER">Prefiro não dizer</option>
                        </select>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                    </div>
 
                    <div class="formulario-modelo">
                        <label for="confirmar_senha">Confirmar senha</label>
                        <input type="password" id="confirmar_senha" name="confirmarSenha" placeholder="Confirme sua senha" minlength="8" required>
                    </div>
 
                    <div class="termos">
                        <input type="checkbox" id="termos" name="aceitouTermos" required>
                        <label for="termos">
                            Aceito os <a href="/termos-de-uso">Termos de Uso</a> e a <a href="/politica-de-privacidade">Política de Privacidade</a>
                        </label>
                    </div>
 
                    <button type="submit">Criar conta</button>
 
                    <p class="ou-cadastre">Ou cadastre-se com</p>
 
                    <div class="social-login">
 
                        <button type="button" class="social-button google">
                            <div>
                                <img src="../../assets/img/icone-google.png" alt="Ícone do Google">
                                Google
                            </div>
                        </button>
 
                        <button type="button" class="social-button apple">
                            <div>
                                <img src="../../assets/img/icone-apple.png" alt="Ícone da Apple">
                                Apple
                            </div>
                        </button>
 
                    </div>
 
                    <p class="login-existente">
                        Já tem uma conta?
                        <a href="../login/login.html">Entrar</a>
                    </p>
 
                </form>
 
            </div>
 
        </div>
 
    </main>
    <script src="../../js/cadastro.js"></script>
</body>
</html>
