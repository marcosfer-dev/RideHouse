<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/import.css">
    <link rel="stylesheet" href="../../css/cadastro.css">


    <title>Cadastro</title>
</head>

<body>
    <main class="cadastro-container">

        <div class="img">
            <img src="../../assets/img/img-temp-cadastro.png" alt="Imagem de bicicleta e no fundo a cafeteria">
        </div>

        <div class="bg">

            <h1>Criar sua conta</h1>

            <p>Preencha os dados abaixo para criar sua conta</p>

            <div class="cadastro-forms">

                <form>

                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nomeCompleto" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>

                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" required>

                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="dataNascimento" required>

                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="genero">Gênero</label>
                    <select id="genero" name="genero" required>
                        <option value="">Selecione</option>
                        <option value="MASCULINO">Masculino</option>
                        <option value="FEMININO">Feminino</option>
                        <option value="NAO_BINARIO">Não binário</option>
                        <option value="PREFIRO_NAO_DIZER">Prefiro não dizer</option>
                    </select>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>

                    <label for="confirmar_senha">Confirmar senha</label>
                    <input type="password" id="confirmar_senha" name="confirmarSenha" required>

                    <div class="termos">
                        <input type="checkbox" id="termos" name="aceitouTermos" required>
                        <label for="termos">
                            Aceito os Termos de Uso e a Política de Privacidade
                        </label>
                    </div>

                    <button type="submit">Criar conta</button>

                    <p>Ou cadastre-se com</p>

                    <div class="social-login">

                        <button type="button" class="social-button google">
                            Google
                        </button>

                        <button type="button" class="social-button apple">
                            Apple
                        </button>

                    </div>

                    <p>
                        Já tem uma conta?
                        <a href="/">Entrar</a>
                    </p>

                </form>

            </div>

        </div>

    </main>
</body>
</html>
